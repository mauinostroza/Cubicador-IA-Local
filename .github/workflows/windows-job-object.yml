name: Windows Job Object security

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        # PDFium remains closed in this smoke. Installing the optional
        # pypdfium2 dependency here would resolve an un-hashed wheel.
        run: python -m pip install -e ".[test]"
      - name: Run Job Object smoke
        working-directory: backend
        run: python scripts/windows_job_smoke.py
      - name: Run offline vendor release contract fixture
        working-directory: backend
        run: python scripts/windows_vendor_smoke.py
      - name: Verify pending OCR release contract (fail closed)
        working-directory: backend
        run: python scripts/verify_release_contract.py
      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
