name: Windows Job Object security

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/src/cubicador/runtime.py"
      - "backend/src/cubicador/security.py"
      - "backend/scripts/windows_job_smoke.py"
      - ".github/workflows/windows-job-object.yml"
  pull_request:
    paths:
      - "backend/src/cubicador/runtime.py"
      - "backend/src/cubicador/security.py"
      - "backend/scripts/windows_job_smoke.py"
      - ".github/workflows/windows-job-object.yml"

jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e .
      - name: Run Job Object smoke
        working-directory: backend
        run: python scripts/windows_job_smoke.py
      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
