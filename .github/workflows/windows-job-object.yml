name: Windows Job Object security

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/src/**"
      - "backend/scripts/**"
      - "backend/tests/**"
      - "backend/pyproject.toml"
      - "backend/ocr-release.lock.json"
      - "backend/docs/dependencies/**"
      - ".github/workflows/windows-job-object.yml"
  pull_request:
    paths:
      - "backend/src/**"
      - "backend/scripts/**"
      - "backend/tests/**"
      - "backend/pyproject.toml"
      - "backend/ocr-release.lock.json"
      - "backend/docs/dependencies/**"
      - ".github/workflows/windows-job-object.yml"

jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[test,pdfium]"
      - name: Run Job Object smoke
        working-directory: backend
        run: python scripts/windows_job_smoke.py
      - name: Run offline vendor release contract fixture
        working-directory: backend
        run: python scripts/windows_vendor_smoke.py
      - name: Verify pending OCR release contract (fail closed)
        working-directory: backend
        run: python scripts/verify_release_contract.py
      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
