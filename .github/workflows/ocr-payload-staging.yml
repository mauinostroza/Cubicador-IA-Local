# Preview/staging only. This workflow is not a production trust root and its
# artifact must never be shipped while the release gate is closed.
name: OCR payload staging (closed preview)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/ocr-release.lock.json"
      - "backend/scripts/build_ocr_staging.py"
      - "backend/scripts/verify_release_contract.py"
      - "backend/docs/dependencies/**"
      - ".github/workflows/ocr-payload-staging.yml"

permissions:
  contents: read

jobs:
  stage:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      CI: "true"
      GITHUB_ACTIONS: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify closed release contract
        working-directory: backend
        run: python scripts/verify_release_contract.py
      - name: Download and verify exact staging inputs
        working-directory: backend
        run: python scripts/build_ocr_staging.py --staging ..\ocr-staging
      - name: Verify production remains blocked
        shell: pwsh
        run: |
          $status = Get-Content ocr-staging/STAGING-STATUS.json | ConvertFrom-Json
          if ($status.production -ne $false -or $status.release_enabled -ne $false) { throw "Staging no está cerrado" }
          if ($status.blocked_assets.Count -lt 1) { throw "El preview no registró los assets bloqueados" }
      - name: Upload non-production staging evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cubicador-ocr-staging-${{ github.run_id }}
          path: ocr-staging/
          if-no-files-found: error
          retention-days: 7
