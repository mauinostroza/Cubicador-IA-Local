[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cubicador-ia-local"
version = "0.1.0"
description = "Extractor offline de tablas resumen de cantidades desde PDF con texto"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4", "pydantic>=2.6,<3"]

[project.scripts]
cubicador = "cubicador.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

