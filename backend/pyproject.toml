[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cubicador-ia-local"
version = "0.1.0"
description = "Extractor offline de tablas resumen de cantidades desde PDF con texto"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4", "pydantic>=2.6,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
test = ["reportlab>=4,<5", "pypdf>=6,<7"]
# Preview only. Release activation additionally requires the exact Windows
# wheel hash/provenance recorded in ocr-release.lock.json.
pdfium = ["pypdfium2==5.3.0"]

[project.scripts]
cubicador = "cubicador.cli:main"
cubicador-local-api = "cubicador.http:main"

[tool.setuptools.packages.find]
where = ["src"]
